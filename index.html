<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>업무관리</title>
<!-- PWA (설치형 웹앱) -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#111111" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="업무관리" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="업무관리" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'7'%20fill%3D'%23161616'%2F%3E%3Ctext%20x%3D'16'%20y%3D'22'%20text-anchor%3D'middle'%20font-family%3D'Arial%2CHelvetica%2Csans-serif'%20font-weight%3D'800'%20font-size%3D'20'%20letter-spacing%3D'-1'%20fill%3D'%230A84FF'%3EB%3C%2Ftext%3E%3Crect%20x%3D'10.5'%20y%3D'24'%20width%3D'11'%20height%3D'2.4'%20rx%3D'1.2'%20fill%3D'%230A84FF'%2F%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Apple HIG 다크 모드 시스템 색 기반 */
    --bg:#1c1c1e; --side:#000000; --side-ink:#f2f2f7; --side-hover:#2c2c2e;
    --card:#2c2c2e; --ink:#ffffff; --muted:#98989e; --line:#38383a;
    --accent:#0a84ff; --accent-2:#6cb6ff; --accent-soft:#0e2a45; --on-accent:#ffffff; --good:#30d158; --bad:#ff453a;
    --shadow:0 4px 18px rgba(0,0,0,.5); --input:#2c2c2e;
    /* PC 본문 최대 폭. 이 숫자 하나만 고치면 좌우 폭이 바뀐다.
       (1920 최대화 기준 기존 콘텐츠 폭 ≈1695px) */
    --main-max:1100px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  h1,h2,h3,.brand{font-weight:700}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;transition:.12s}
  input,textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--input);color:var(--ink);width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  /* 게시판(노트·일기·QT·설교·독서) 본문이 화면을 꽉 채우고, 내용에 맞춰 늘어나며 페이지 전체가 스크롤되도록 */
  /* 글 쓸 때(textarea)와 다 쓴 뒤(.detail-body)의 글씨 크기·줄간격을 똑같이 맞춘다 */
  .ta-fill{min-height:calc(100vh - 330px);min-height:calc(100dvh - 330px);resize:none;overflow:hidden;
           font-size:16px;line-height:1.8}
  .ta-grow{resize:none;overflow:hidden;min-height:62px}
  .detail-body{white-space:normal;line-height:1.8;min-height:calc(100vh - 330px);min-height:calc(100dvh - 330px)}
  /* # / ## / ### 로 만든 제목 */
  .md-p{white-space:pre-wrap}
  .md-h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:22px 0 8px;line-height:1.4}
  .md-h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:18px 0 7px;line-height:1.45}
  .md-h3{font-size:17px;font-weight:600;margin:15px 0 6px;line-height:1.5;color:var(--accent-2)}
  .detail-body>:first-child{margin-top:0}
  @media(max-width:760px){
    .ta-fill{min-height:calc(100vh - 290px);min-height:calc(100dvh - 290px)}
    .detail-body{min-height:calc(100vh - 290px);min-height:calc(100dvh - 290px)}
  }
  input[type=range]{accent-color:var(--accent);padding:0}
  input[type=date],input[type=time]{cursor:pointer}
  input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(0.85);cursor:pointer;opacity:.85;font-size:16px}
  .hidden{display:none!important}

  .demo-banner{background:#262626;color:#cfcfcf;text-align:center;font-size:12.5px;padding:7px}

  .layout{display:flex;min-height:100vh}
  .topbar{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--side);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
  .topbar .hamb{background:transparent;border:none;color:var(--ink);padding:4px;cursor:pointer}
  .topbar .hamb svg{width:24px;height:24px}
  .topbar .tb-title{font-weight:600;font-size:17px;margin-left:auto}
  .side-close{display:none}
  .side-collapse{margin-left:auto;background:transparent;border:none;color:#6a6a6a;padding:4px;cursor:pointer;border-radius:3px}
  .side-collapse svg{width:18px;height:18px}
  .side-collapse:hover{color:var(--accent);background:var(--side-hover)}
  .copyright-fixed{position:fixed;right:14px;bottom:9px;font-size:11px;color:#555;z-index:20;pointer-events:none}
  .lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .lock-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:36px 28px;width:100%;max-width:320px;text-align:center;box-shadow:var(--shadow)}
  .lock-logo{color:var(--accent);margin-bottom:12px}
  .lock-logo svg{width:34px;height:34px}
  .lock-card h1{font-size:22px;margin-bottom:4px}
  .lock-card p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .lock-card input{text-align:center;margin-bottom:12px;font-size:16px;letter-spacing:3px}
  .lock-card button{width:100%;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px;border-radius:5px;cursor:pointer}
  .lock-msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  @media(min-width:761px){
    .layout.collapsed aside{width:58px;flex-basis:58px;padding-left:8px;padding-right:8px}
    .layout.collapsed .brand{justify-content:center;padding:6px 0 12px}
    .layout.collapsed .brand>svg,.layout.collapsed .brand>i,.layout.collapsed .brand span{display:none}
    .layout.collapsed .side-collapse{margin-left:0}
    .layout.collapsed .nav-sec{display:none}
    .layout.collapsed .lab{display:none}
    .layout.collapsed aside nav button{justify-content:center;padding:11px 0;gap:0}
    .layout.collapsed .side-foot{display:none}
  }
  .backdrop{display:none}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  /* PC 좌측 메뉴 폭 — 210px 의 1.5배. 글자 크기는 그대로 둔다.
     (모바일은 아래 미디어쿼리에서 width:90% 로 덮어쓰므로 영향 없음) */
  aside{width:315px;flex:0 0 315px;background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  aside nav{flex:1;overflow-y:auto;min-height:0}
  .side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  aside .brand{font-size:20px;color:#fff;padding:6px 10px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
  .brand-bar{flex:0 0 auto;width:4px;height:22px;border-radius:1px;background:var(--accent)}
  .layout.collapsed .brand .brand-bar{display:none}
  aside nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--side-ink);padding:10px 12px;font-size:14.5px;border-radius:4px;margin-bottom:2px}
  aside nav button:hover{background:var(--side-hover)}
  aside nav button.on{background:var(--accent);color:var(--on-accent);font-weight:500}
  aside .nav-sec{font-size:10.5px;color:#9c9c9c;padding:14px 12px 5px;letter-spacing:.03em}
  aside .ico{width:20px;text-align:center}
  aside nav button svg,aside .brand svg{width:18px;height:18px}
  aside nav button svg{color:var(--side-ink)}
  aside nav button.on svg{color:var(--on-accent)}
  aside .brand svg{color:var(--accent)}
  details.acard{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.22);margin-bottom:14px}
  details.acard>summary{cursor:pointer;padding:15px 20px;font-size:15px;font-weight:600;color:var(--ink);list-style:none}
  details.acard>summary::-webkit-details-marker{display:none}
  details.acard>summary::before{content:"＋ ";color:var(--accent)}
  details.acard[open]>summary::before{content:"− ";color:var(--accent)}
  details.acard .acbody{padding:0 20px 18px}

  main{flex:1;padding:26px 34px 70px;width:100%;max-width:var(--main-max);margin:0 auto}
  .page-h{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;color:var(--ink)}
  .page-sub{color:var(--muted);font-size:15px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.22);padding:18px 20px;margin-bottom:14px}
  .card h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:14px;color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
  .row .n1{flex:0 0 130px}.row .n2{flex:0 0 100px}
  .mt{margin-top:9px}
  .addb{background:var(--accent-soft);color:var(--accent-2);font-weight:700;padding:10px;width:100%}
  .addb:hover{background:var(--accent);color:var(--on-accent)}
  .ghostb{background:var(--input);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:4px}
  .ghostb:hover{border-color:var(--accent)}
  .ghostb.danger{color:var(--bad)}
  .linklike{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px 4px}
  .empty{color:var(--muted);text-align:center;padding:22px 0;font-size:13.5px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2)}

  .item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .chk{width:20px;height:20px;flex:0 0 20px;border:2px solid var(--line);border-radius:3px;background:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .chk.on{background:var(--accent);border-color:var(--accent)}
  .item .bd{flex:1;min-width:0}.item .bd .t{font-weight:500}
  .item.done .bd .t{text-decoration:line-through;color:var(--muted)}
  .item.link:hover{background:#2c2c2e;border-radius:4px}
  .meta{font-size:13px;color:var(--muted)}
  .del{background:none;color:var(--muted);font-size:17px;line-height:1;padding:0 3px}
  .del:hover{color:var(--bad)}
  .sub-tabs{display:flex;gap:6px;margin-bottom:14px}
  .sub-tabs button{background:var(--input);border:1px solid var(--line);color:var(--muted);padding:7px 14px;font-size:13px;border-radius:10px}
  .sub-tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .linkchip{display:inline-block;background:var(--input);border:1px solid var(--line);color:var(--accent);padding:8px 14px;border-radius:10px;font-size:13px;text-decoration:none}
  .linkchip:hover{border-color:var(--accent)}

  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tblwrap{overflow-x:auto}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .stat .s{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
  .stat .s .lab{font-size:12px;color:var(--muted)}
  .stat .s .val{font-size:22px;font-weight:700;margin-top:3px;color:var(--accent)}

  /* ===== 통계보고 월별 제공 체크 (O/X) ===== */
  .rpt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .rpt-head .ym{font-size:16px;font-weight:700;min-width:118px;text-align:center}
  .rpt-nav{background:#2c2c2e;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:4px;font-size:13px}
  .rpt-nav:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .rpt-nav:disabled{opacity:.35;cursor:not-allowed}
  .rpt-spacer{flex:1}
  .rpt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:0 20px}
  .rpt-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rpt-row .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rpt-row .fd{flex:0 0 auto;font-size:11px;color:var(--muted)}
  .oxb{flex:0 0 42px;width:42px;height:28px;border-radius:4px;border:1px solid var(--line);background:var(--input);color:var(--muted);font-weight:700;font-size:13px;line-height:1}
  .oxb.on{background:var(--good);border-color:var(--good);color:#0b2a13}
  .oxb.off:hover{border-color:var(--bad);color:var(--bad)}
  .rpt-bar{height:7px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 12px}
  .rpt-bar>i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .2s}
  @media(max-width:760px){
    .rpt-grid{grid-template-columns:1fr}
    .rpt-head .ym{min-width:0;flex:1}
  }

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head button{background:#2c2c2e;border:1px solid var(--line);padding:6px 12px;border-radius:4px;font-size:13px;color:var(--ink)}
  .cal-head button:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .cal-grid .dow{background:#2c2c2e;text-align:center;font-size:12px;color:var(--muted);padding:7px 0}
  .cal-grid .cell{background:var(--card);min-height:82px;padding:5px 6px;font-size:12px}
  .cal-grid .cell .dn{color:var(--muted);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px}
  .cal-grid .cell.today .dn{background:var(--accent);color:var(--on-accent)}
  .cal-grid .cell.out{background:#161618}
  .cal-grid .ev{background:#3a3a3a;color:#e0e0e0;border-radius:3px;padding:2px 5px;margin-top:3px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .costday{white-space:nowrap}
  .nowrap-t{white-space:nowrap}
  .sort-toggle{display:flex;gap:4px}
  .sort-toggle button{background:var(--input);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 11px;border-radius:4px}
  .sort-toggle button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

  /* 주간일정: 마우스로 끌어서 좌우 이동. 스크롤바는 숨긴다. */
  .week-scroll{overflow-x:auto;margin:0 -2px;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
  .week-scroll::-webkit-scrollbar{width:0;height:0;display:none}
  .week-scroll.dragging,.week-scroll.dragging .wcol{cursor:grabbing}
  .week-scroll.dragging{user-select:none}
  /* PC에서는 카드 안쪽 여백만큼 끌어내 '일정' 제목선과 왼쪽 끝을 맞춘다 */
  @media(min-width:761px){.week-scroll{margin:0 -20px}}
  .week-grid{display:grid;gap:7px}
  .wcol{background:#2c2c2e;border:1px solid var(--line);border-radius:5px;padding:7px;min-height:104px;cursor:pointer}
  .wcol:hover{border-color:var(--accent)}
  .wcol.today{border-color:var(--accent);background:var(--card)}
  .wcol.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .wcol-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-align:center}
  .wcol.today .wcol-h{color:var(--accent)}
  .wtask{font-size:12px;line-height:1.35;display:flex;align-items:flex-start;gap:5px;padding:4px 6px;border-radius:3px;margin-bottom:3px;background:var(--card);border:1px solid var(--line);word-break:keep-all}
  .wtask.done{opacity:.5;text-decoration:line-through}
  .pdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px}
  .wempty{color:#8f8f8f;font-size:11px;text-align:center;padding:4px 0}
  .wmain{font-size:11.5px;font-weight:600;color:var(--accent-2);background:var(--accent-soft);border-radius:3px;padding:4px 7px;margin-bottom:5px;white-space:normal;line-height:1.4;word-break:break-word}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){
    /* iOS 사파리는 글자크기 16px 미만인 입력칸을 탭하면 화면을 자동 확대한다.
       확대된 뒤엔 원래대로 돌아오지 않아 가로 스크롤이 생긴다.
       모바일에서만 16px로 올려 이를 막는다. (PC는 기존 14px 유지) */
    input,textarea,select{font-size:16px}
    .two-col{grid-template-columns:1fr}
    .topbar{display:flex}
    aside{position:fixed;left:0;top:0;width:90%;max-width:360px;height:100vh;transform:translateX(-100%);transition:transform .22s ease;z-index:60;padding:14px 16px}
    aside.open{transform:translateX(0)}
    .side-close{display:block;position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--side-ink);padding:6px;cursor:pointer}
    .side-close svg{width:26px;height:26px}
    .side-collapse{display:none}
    aside nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
    aside nav .nav-sec{grid-column:1/-1;padding-top:8px}
    aside nav>button:first-of-type{grid-column:1/-1}
    aside nav button{padding:12px 12px;font-size:15.5px}
    main{padding:14px 14px 60px;max-width:100%}
    .page-h{font-size:25px}
    .card{padding:15px 16px}
    .row .n1,.row .n2{flex:1 1 46%}
    .sub-tabs{flex-wrap:wrap}
    .stat{grid-template-columns:1fr 1fr}
    .cal-grid{gap:1px}
    .cal-grid .cell{min-height:64px;font-size:11px;padding:4px 3px}
    .cal-grid .cell .dn{width:20px;height:20px;font-size:11.5px}
    .cal-grid .dow{font-size:11px;padding:6px 0}
    .cal-grid .ev{font-size:9.5px;padding:1px 3px;white-space:normal;line-height:1.2}
    .mobwide{flex:1 1 100%!important}
  }
  .tt-time{color:var(--muted);font-weight:600;margin-right:5px}

  /* ===== 제자리 수정(인라인 편집) =====
     글자가 있던 자리에 투명한 입력칸을 깔아, 수정 모드로 들어가도
     줄 수·글자 위치가 그대로 유지되게 한다. 저장 버튼은 두지 않고
     입력할 때마다 바로 저장한다(Enter/Esc/바깥클릭으로 종료). */
  .ie{background:transparent;border:1px solid transparent;border-radius:3px;
      padding:0 4px;margin:-1px -5px;color:var(--ink);font-family:inherit;

let _saveT,dataReady=false;function save(){clearTimeout(_saveT);_saveT=setTimeout(()=>{if(sb&&currentUser&&dataReady)sb.from("app_data").upsert({user_id:currentUser.id,data:DB,updated_at:new Date().toISOString()}).then(null,e=>console.warn("save",e));},700);}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(d){if(!d)return"";const x=new Date(d+"T00:00:00");const w=["일","월","화","수","목","금","토"];return `${x.getMonth()+1}월 ${x.getDate()}일 (${w[x.getDay()]})`;}
function val(id){return document.getElementById(id).value.trim();}
const main=document.getElementById("main");
const DOW=["일","월","화","수","목","금","토"];

/* ===== 네비게이션 ===== */
let page="dashboard";

const PAGES={dashboard:rDashboard,schedule:rSchedule,routines:rRoutines,calendar:rCalendar,diary:rDiary,goals:rGoals,faith:rFaith,clients:rClients,costs:rCosts,retro:rRetro,books:rBooks,notes:rNotes,feedback:rFeedback,accounts:rAccounts,backup:rBackup};
/* 한 페이지가 죽어도 앱 전체가 멈추지 않도록 렌더를 격리한다 */
function render(){
  const fn=PAGES[page];
  try{
    if(typeof fn!=="function")throw new Error("알 수 없는 페이지: "+page);
    fn();
  }catch(e){
    console.error("[render] "+page,e);
    main.innerHTML=`<h1 class="page-h">화면을 불러오지 못했어요</h1>

      <div class="card"><div class="meta" style="white-space:pre-wrap;color:var(--bad)">${esc(String((e&&e.message)||e))}</div>
        <button class="ghostb mt" onclick="render()">다시 시도</button></div>`;
  }
  try{if(typeof setSearchPlaceholder==="function")setSearchPlaceholder();sizeGrow();if(window.lucide)lucide.createIcons();}catch(e){console.warn("[render] 후처리",e);}
}
/* 텍스트영역 자동 늘어남: 내용에 맞춰 커지고 페이지가 통째로 스크롤됨 */
function autoGrow(ta){if(!ta)return;ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px";}
/* 본문 렌더러 — 줄 맨 앞의 #, ##, ### 만 제목으로 바꾼다.
   그 외 문자는 전부 esc() 로 이스케이프하므로 HTML 주입 위험이 없다.
   제목이 아닌 줄들은 묶어서 .md-p(줄바꿈 보존) 안에 넣는다. */
function mdBody(t){
  const lines=String(t==null?"":t).split("\n");
  let out="",buf=[];
  const flush=()=>{ if(buf.length){ out+=`<div class="md-p">${esc(buf.join("\n"))}</div>`; buf=[]; } };
  for(const ln of lines){
    const m=/^(#{1,3})[ \t]+(.*)$/.exec(ln);
    if(m){ flush(); out+=`<div class="md-h${m[1].length}">${esc(m[2])}</div>`; }
    else buf.push(ln);
  }
  flush();
  return out;
}

function gScore(keys,q){let best=0;for(let i=0;i<keys.length;i++){const k=keys[i];if(!k)continue;const idx=k.toString().toLowerCase().indexOf(q);if(idx<0)continue;const sc=i===0?(idx===0?100:70):40;if(sc>best)best=sc;}return best;}
function gSearch(q){
  q=(q||"").trim().toLowerCase();

/* ===== 1) 일정 (주간 보기 · 날짜 선택 · 반응형) ===== */
const PRI={1:{t:"1순위",c:"#e0e0e0"},2:{t:"2순위",c:"#b6b6b6"},3:{t:"3순위",c:"#8f8f8f"},4:{t:"4순위",c:"#6f6f6f"}};
/* 우선순위 미지정(null) 지원.
   기존 데이터는 priority가 명시돼 있으므로 표시가 바뀌지 않고,
   새로 추가하는 업무만 "미지정"으로 시작해 직접 고르도록 유도한다. */
const PRI_NONE={t:"미지정",c:"#4a4a4a"};
function priInfo(p){return PRI[p]||PRI_NONE;}
function priRank(p){return p?+p:5;}   /* 미지정은 정렬상 맨 뒤 */
let selDay=null;
function isMobile(){return window.innerWidth<=760;}
function weekStart(ds){const d=new Date(ds+"T00:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d;}
function fmtShort(ds){const x=new Date(ds+"T00:00:00");return `${x.getMonth()+1}.${x.getDate()}`;}

/* ═══ 일정 인사이트 ═══
   모두 "읽기 전용" 계산이다. 어떤 것도 저장된 일정을 자동으로 바꾸지 않는다.
   옮길지 말지는 항상 사용자가 직접 누른다. */

/* 지난 날짜에 남아 있는 미완료 업무 */
function staleTasks(){
  const today=T();
  return DB.schedules.map((s,i)=>({s,i}))
    .filter(o=>!o.s.done&&o.s.date&&o.s.date<today)
    .sort((a,b)=>a.s.date.localeCompare(b.s.date));
}
/* 며칠째 밀렸는지 */
function daysLate(ds){
  const a=new Date(ds+"T00:00:00"), b=new Date(T()+"T00:00:00");
  return Math.round((b-a)/86400000);
}
/* 요일별 과거 미완료율 — 과부하 경고의 근거 */
function dowMissRate(){
  const today=T(), hist={};
  DB.schedules.forEach(s=>{
    if(!s.date||s.date>=today)return;
    const w=new Date(s.date+"T00:00:00").getDay();
    if(!hist[w])hist[w]={t:0,u:0};
    hist[w].t++; if(!s.done)hist[w].u++;
  });
  return hist;
}
/* 이번 주 남은 날 중 일이 몰린 날 */
function overloadWarning(weekDays){
  const today=T(), hist=dowMissRate(), out=[];
  weekDays.forEach(d=>{
    if(d<today)return;
    const u=dayUnits(d);
    if(u.total<10)return;                       /* 10건 미만은 경고하지 않음 */
    const h=hist[new Date(d+"T00:00:00").getDay()];
    out.push({date:d,total:u.total,miss:(h&&h.t>=10)?Math.round(100*h.u/h.t):null});
  });
  return out;
}
/* 20시 이후로 잡은 일정의 과거 완료율 */
function eveningStats(){
  const today=T(); let t=0,d=0;
  DB.schedules.forEach(s=>{
    if(!s.date||s.date>=today||!s.time)return;
    if(parseInt(s.time.slice(0,2))<20)return;
    t++; if(s.done)d++;
  });
  return {total:t,done:d,rate:t?Math.round(100*d/t):null};
}

function normTime(s){s=(s||"").trim();if(!s)return"";s=s.replace(/[^0-9:]/g,"");let h,m,mm=s.match(/^(\d{1,2}):(\d{1,2})$/);if(mm){h=+mm[1];m=+mm[2];}else if(/^\d{3,4}$/.test(s)){h=+s.slice(0,s.length-2);m=+s.slice(-2);}else if(/^\d{1,2}$/.test(s)){h=+s;m=0;}else return"";if(h>23||m>59)return"";return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}

/* ===== 주간일정 좌우 드래그 패닝 =====
   .week-scroll 안을 마우스로 끌면 좌우로 밀린다. 스크롤바는 CSS로 숨겨둠.
   5px 넘게 움직였을 때만 '끌기'로 보고, 그 뒤 이어지는 click 은 삼켜서
   날짜칸 선택(selectDay)이 잘못 발동하지 않게 한다.
   document 에 한 번만 걸어두므로 rSchedule() 이 다시 그려도 계속 동작한다. */
(function(){
  let box=null,startX=0,startLeft=0,moved=false,pid=null;
  const THRESH=5, SWALLOW_MS=350;
  document.addEventListener("pointerdown",function(e){
    if(e.button!==undefined&&e.button!==0)return;
    const t=e.target;if(!t||!t.closest)return;
    const s=t.closest(".week-scroll");if(!s)return;
    if(s.scrollWidth<=s.clientWidth)return;        // 넘칠 때만 끌기 활성
    box=s;startX=e.clientX;startLeft=s.scrollLeft;moved=false;pid=e.pointerId;
  });
  document.addEventListener("pointermove",function(e){
    if(!box)return;
    const dx=e.clientX-startX;
    if(!moved){
      if(Math.abs(dx)<THRESH)return;
      moved=true;box.classList.add("dragging");
      try{box.setPointerCapture(pid);}catch(_){}
    }
    box.scrollLeft=startLeft-dx;
    if(e.cancelable)e.preventDefault();
  });
  function end(){
    if(!box)return;
    const b=box,was=moved;
    try{b.releasePointerCapture(pid);}catch(_){}
    b.classList.remove("dragging");
    box=null;moved=false;pid=null;
    if(was){                                        // 끌기 직후의 click 1회 무효화
      const sw=function(ev){ev.stopPropagation();ev.preventDefault();};
      b.addEventListener("click",sw,true);
      setTimeout(function(){b.removeEventListener("click",sw,true);},SWALLOW_MS);
    }
  }
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",end);
})();

function drawDay(){
  const el=document.getElementById("tlist");
  if(!el)return;
  const rd=rdoneOf(selDay);
  const skipped=routinesSkipped(selDay);

  /* 일반 업무와 루틴을 한 목록으로 합쳐, 위쪽 정렬 토글(우선순위순/시간순)을
     똑같이 적용한다. 루틴이라고 위에 고정되지 않는다. */
  const units=[];
  DB.schedules.forEach((s,i)=>{
    if(s.date===selDay)units.push({kind:"task",s,i,done:!!s.done,time:s.time||"",pri:s.priority});
  });
  routinesForDate(selDay).forEach(r=>{
    units.push({kind:"routine",r,done:!!rd[r.id],time:r.time||"",pri:r.pri});
  });
  const cmp = todaySort==="time"
    ? (a,b)=>(a.done-b.done)||((a.time||"99:99").localeCompare(b.time||"99:99"))
    : (a,b)=>(a.done-b.done)||(priRank(a.pri)-priRank(b.pri))||((a.time||"99:99").localeCompare(b.time||"99:99"));
  units.sort(cmp);

  let html = units.length
    ? units.map(u=>u.kind==="task"?taskRow(u.s,u.i):routineRow(u.r,u.done)).join("")
    : (skipped.length?"":'<div class="empty">이 날 업무가 없어요.</div>');

  if(skipped.length){
    html+=`<div style="height:12px"></div>`;
    /* 그날만 뺀 루틴 — 되돌릴 수 있게 남겨둔다 */
    html+=`<div class="meta" style="margin:0 0 6px;color:var(--muted)">건너뛴 루틴 · ${skipped.length}건 <span style="color:#6a6a6a">(달성률에서 제외됨)</span></div>`;
    html+=skipped.map(r=>`<div class="item" style="opacity:.5">
      <span class="pdot" style="background:${priInfo(r.pri).c};margin-top:8px"></span>
      <div class="bd"><div class="t" style="text-decoration:line-through">${r.time?`<span class="tt-time">${esc(r.time)}</span> `:""}${esc(r.title)}</div>
        <div class="meta">${rtRecurLabel(r)}</div></div>
      <button class="linklike" onclick="routineUnskip('${r.id}')" title="이 날 다시 하기">되돌리기</button></div>`).join("");
  }
  el.innerHTML=html;
  /* 수정 모드로 들어왔으면 제목칸에 커서를 둔다 (스크롤은 건드리지 않는다) */
  const f=el.querySelector('[data-focus="1"]');
  if(f){try{f.focus({preventScroll:true});const n=f.value.length;if(f.setSelectionRange)f.setSelectionRange(n,n);}catch(_){}}
}

window.ieKey=(e)=>{

let ieOutside=null;
function ieArm(){
  if(ieOutside)return;

  setTimeout(function(){
    if(editSchedIdx===null&&editRtId===null)return;
    ieOutside=function(ev){
      if(ev.target&&ev.target.closest&&ev.target.closest('[data-edit="1"]'))return;
      ieExit();
    };
    document.addEventListener("mousedown",ieOutside,true);
  },0);
}

/* ---- 루틴: 그 날짜만 수정 (원본 루틴은 건드리지 않는다) ----
   dayinfo[날짜].rover[루틴id] = {time?,title?,pri?} 형태로 바뀐 값만 저장한다.
   원본과 같아지면 항목을 지워 블롭이 불어나지 않게 한다. */
window.rtDayEdit=(id)=>{editRtId=id;editSchedIdx=null;drawDay();ieArm();};
window.rtDayField=(id,f,el)=>{
  const base=(DB.routines||[]).find(x=>x.id===id);if(!base)return;
  if(!DB.dayinfo[selDay])DB.dayinfo[selDay]={};
  const di=DB.dayinfo[selDay];
  if(!di.rover)di.rover={};
  const ov=di.rover[id]||(di.rover[id]={});
  if(f==="time"){
    const v=normTime(el.value);el.value=v;
    if(v===(base.time||""))delete ov.time;else ov.time=v;
  }else if(f==="title"){
    const v=el.value.trim();
    if(!v){el.value=base.title;delete ov.title;}
    else if(v===base.title)delete ov.title;else ov.title=v;
  }else if(f==="pri"){
    const n=parseInt(el.value)||null;
    if(n===(base.pri||null))delete ov.pri;else ov.pri=n;
  }
  if(!Object.keys(ov).length)delete di.rover[id];
  if(!Object.keys(di.rover).length)delete di.rover;
  save();
};

/* ═══════════════════════════════════════════════════════════════
   루틴업무 — 일간·주간·월간 반복 업무
   완료 여부는 일정을 복제하지 않고 dayinfo[날짜].rdone[루틴id]에 기록한다.

   설계 노트 — 이전 버전에서 문제가 됐던 지점을 모두 막았다:
   · startDate 필수 → 루틴을 만들기 "이전" 날짜에는 절대 나타나지 않는다
   · endDate/paused → 그만둔 루틴도 지난 기록은 그대로 보존된다
   · 말일 보정      → 31일 루틴이 30일까지인 달에서 조용히 사라지지 않는다
   · 달성률 반영    → 루틴 완료가 일정 달성률에 함께 집계된다 (dayUnits)
   · 고아기록 청소  → 루틴 삭제 시 dayinfo의 완료기록도 함께 정리한다
   ═══════════════════════════════════════════════════════════════ */
const RTNAME={daily:"일간",weekly:"주간",monthly:"월간"};
let routineTab="daily", routineSel=new Set(), routineEdit=null;

function lastDomOf(ds){const d=new Date(ds+"T00:00:00");return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}

/* 반복 규칙상 그 날짜에 해당하는 루틴 (그날만 건너뛴 것도 포함) */
function routinesMatching(ds){
  const list=DB.routines||[];
  if(!list.length||!ds)return [];
  const dt=new Date(ds+"T00:00:00");
  const dow=dt.getDay(), dom=dt.getDate(), lastDom=lastDomOf(ds);
  const ov=roverOf(ds);
  return list.filter(r=>{
    if(r.paused)return false;
    if(r.startDate&&ds<r.startDate)return false;   /* 시작일 이전엔 표시 안 함 */
    if(r.endDate&&ds>r.endDate)return false;       /* 종료일 이후엔 표시 안 함 */
    if(r.freq==="daily")return true;
    if(r.freq==="weekly")return (r.wd||[]).includes(dow);
    if(r.freq==="monthly"){
      if(r.day==="last")return dom===lastDom;
      return dom===Math.min(parseInt(r.day)||1,lastDom);   /* 말일 보정 */
    }
    return false;
  }).map(r=>applyRover(r,ov[r.id]))
    .sort((a,b)=>(priRank(a.pri)-priRank(b.pri))||((a.time||"99:99").localeCompare(b.time||"99:99")));
}
/* 그 날짜만의 수정분을 입힌 사본을 돌려준다. 원본 루틴은 절대 건드리지 않는다.
   수정분이 없으면 원본을 그대로 쓴다(불필요한 복사 방지). */
function applyRover(r,ov){
  if(!ov)return r;
  const o=Object.assign({},r);
  if(ov.time!==undefined)o.time=ov.time;
  if(ov.title!==undefined)o.title=ov.title;
  if(ov.pri!==undefined)o.pri=ov.pri;
  return o;
}
/* 실제로 그 날 할 루틴 = 규칙에 해당하되, 그날만 건너뛴 것은 제외.
   건너뛴 루틴은 달성률 분모에서도 빠진다 (안 하는 날이니 당연). */
function routinesForDate(ds){
  const skip=rskipOf(ds);
  return routinesMatching(ds).filter(r=>!skip[r.id]);
}
/* 그날만 건너뛴 루틴 목록 */
function routinesSkipped(ds){
  const skip=rskipOf(ds);
  return routinesMatching(ds).filter(r=>skip[r.id]);
}
function rdoneOf(ds){return ((DB.dayinfo[ds]||{}).rdone)||{};}
function rskipOf(ds){return ((DB.dayinfo[ds]||{}).rskip)||{};}
/* 그 날짜만 적용되는 루틴 수정분 */
function roverOf(ds){return ((DB.dayinfo[ds]||{}).rover)||{};}

/* 일정 + 루틴을 합친 그 날의 달성 현황 — 앱 안 모든 달성률의 단일 기준 */
function dayUnits(ds){
  const tasks=DB.schedules.filter(s=>s.date===ds);
  const rts=routinesForDate(ds);
  const rd=rdoneOf(ds);
  const total=tasks.length+rts.length;
  const done=tasks.filter(s=>s.done).length+rts.filter(r=>rd[r.id]).length;
  return {total,done,rate:total?Math.round(done/total*100):0};
}
function rangeUnits(days){
  return days.reduce((a,d)=>{const u=dayUnits(d);a.total+=u.total;a.done+=u.done;return a;},
    {total:0,done:0,get rate(){return this.total?Math.round(this.done/this.total*100):0}});
}

window.routineToggle=(id,ds)=>{
  const d=ds||selDay;
  if(!DB.dayinfo[d])DB.dayinfo[d]={};
  const di=DB.dayinfo[d];
  if(!di.rdone)di.rdone={};
  if(di.rdone[id])delete di.rdone[id]; else di.rdone[id]=true;
  save();render();   /* 현재 페이지를 다시 그린다 (일정·대시보드 어디서 눌러도 동작) */
};

/* 그날 하루만 이 루틴을 빼기 (공휴일·쉬는 날 등).
   루틴 자체는 그대로 남아 다른 날에는 계속 나온다. */
window.routineSkip=(id,ds)=>{
  const d=ds||selDay;
  if(!DB.dayinfo[d])DB.dayinfo[d]={};
  const di=DB.dayinfo[d];
  if(!di.rskip)di.rskip={};
  di.rskip[id]=true;
  if(di.rdone)delete di.rdone[id];   /* 건너뛴 건 완료가 아니다 */
  save();render();
};
window.routineUnskip=(id,ds)=>{
  const d=ds||selDay;
  const di=DB.dayinfo[d];
  if(di&&di.rskip){delete di.rskip[id];}
  save();render();
};

/* 완료기록 청소 — 블롭이 무한정 커지는 것을 막는다 */
function purgeRdone(id){
  Object.values(DB.dayinfo||{}).forEach(v=>{
    if(!v)return;
    if(v.rdone)delete v.rdone[id];
    if(v.rskip)delete v.rskip[id];
    if(v.rover)delete v.rover[id];
  });
}
function purgeOrphanRdone(){
  const alive=new Set((DB.routines||[]).map(r=>r.id));
  let n=0;
  Object.values(DB.dayinfo||{}).forEach(v=>{
    if(!v)return;
    ["rdone","rskip","rover"].forEach(k=>{
      if(!v[k])return;
      Object.keys(v[k]).forEach(id=>{if(!alive.has(id)){delete v[k][id];n++;}});
    });
  });
  if(n)console.log("[루틴] 고아 기록 "+n+"건 정리");
}

function rtRecurLabel(r){
  if(r.freq==="daily")return "매일";
  if(r.freq==="weekly")return "매주 "+(r.wd||[]).slice().sort((a,b)=>a-b).map(i=>DOW[i]).join("·")+"요일";
  return r.day==="last"?"매월 말일":"매월 "+r.day+"일";
}
function rtPeriodLabel(r){
  const s=r.startDate?fmtShort(r.startDate):"?";
  return r.endDate?`${s} ~ ${fmtShort(r.endDate)}`:`${s} ~`;
}

function rtAdd(){
  const title=val("rt_title");if(!title)return alert("업무 내용을 입력하세요.");
  const start=document.getElementById("rt_start").value;
  if(!start)return alert("시작일을 선택하세요.");
  const end=document.getElementById("rt_end").value||null;
  if(end&&end<start)return alert("종료일이 시작일보다 빠를 수 없어요.");
  const o={freq:routineTab,title,
    pri:parseInt(document.getElementById("rt_pri").value)||null,
    time:normTime(document.getElementById("rt_time").value),
    startDate:start,endDate:end};
  if(routineTab==="weekly"){
    if(!routineSel.size)return alert("반복 요일을 하나 이상 선택하세요.");
    o.wd=[...routineSel].sort((a,b)=>a-b);

    const d=document.getElementById("rt_day").value;
    o.day=d==="last"?"last":parseInt(d);
  }

  else{o.id=uid();o.paused=false;o.createdAt=new Date().toISOString();DB.routines.push(o);}
  routineEdit=null;routineSel=new Set();save();rRoutines();
}

/* ═══════════════════════════════════════════════════════════════
   일기 첨부 사진 — Supabase Storage (비공개 버킷)
   · 이미지 바이너리는 app_data(DB) 에 절대 넣지 않는다. 경로 문자열만 넣는다.
   · 경로 형식: <유저ID>/<일기ID>/<파일명>.jpg
   · 올리기 전에 canvas 로 리사이즈·압축 (가로 1280px / JPEG 0.7 / 약 200KB)
   · 비공개 버킷이므로 볼 때는 signed URL 을 발급해서 쓴다
   · 일기나 사진을 지우면 Storage 파일도 함께 지운다
   기존 save()/app_data/mergeArray 로직은 건드리지 않는다.
   ═══════════════════════════════════════════════════════════════ */
const DIARY_BUCKET="diary-images";      /* 일기 */
const NOTE_BUCKET="note-images";        /* 노트·QT·설교말씀·독서노트 */
const DIARY_MAXW=1280, DIARY_Q=0.7, DIARY_TARGET=200*1024;

/* 표시용 URL 캐시 — 경로 -> {url, exp, blob}
   signed URL 은 1시간짜리라 그냥 캐시해두면 1시간 뒤 깨진 이미지가 된다.
   50분이 지나면 만료로 보고 다시 발급한다. */
const IMG_TTL_SEC=3600, IMG_REFRESH_MS=50*60*1000, IMG_BLOB_MS=24*60*60*1000;
const imgUrlCache={};
function imgCacheGet(p){const c=imgUrlCache[p];return (c&&Date.now()<c.exp)?c.url:null;}
function imgCacheSet(p,url,ms,isBlob){imgUrlCache[p]={url:url,exp:Date.now()+ms,blob:!!isBlob};}
function imgCacheDrop(p){
  const c=imgUrlCache[p];
  if(c&&c.blob){try{URL.revokeObjectURL(c.url);}catch(_){}}   /* 메모리 누수 방지 */
  delete imgUrlCache[p];
}

/* 메뉴별 저장 위치.
   경로는 <유저ID>/<폴더>/<글ID>/<파일명>.jpg — 첫 칸이 항상 유저ID 라서
   "본인 폴더만" RLS 정책이 그대로 적용된다. */
const IMG_KIND={
  diary :{bucket:DIARY_BUCKET, dir:""      , arr:"diary"  , label:"일기"},
  note  :{bucket:NOTE_BUCKET , dir:"note/" , arr:"notes"  , label:"노트"},
  qt    :{bucket:NOTE_BUCKET , dir:"qt/"   , arr:"qt"     , label:"QT"},
  sermon:{bucket:NOTE_BUCKET , dir:"sermon/", arr:"sermons", label:"설교말씀"},
  book  :{bucket:NOTE_BUCKET , dir:"book/" , arr:"books"  , label:"독서노트"},
  fb    :{bucket:NOTE_BUCKET , dir:"fb/"   , arr:"feedback", label:"피드백"}
};
/* 지금 편집 중인 글의 사진 상태 */
let imgCtx={kind:null, draftId:null, cur:[], orig:[]};
function imgBucketOf(kind){return (IMG_KIND[kind]||IMG_KIND.diary).bucket;}
/* 글 수정/작성 화면에 들어갈 때 호출 */
function imgStart(kind,id,existing){
  /* 저장도 취소도 않고 다른 글로 넘어간 경우 — 그때 올린 사진은 쓰이지 않으므로
     Storage 에 고아로 남지 않게 치운다. (기다리지 않고 뒤에서 처리) */
  if(imgCtx.kind&&(imgCtx.kind!==kind||imgCtx.draftId!==id)){
    const added=imgCtx.cur.filter(p=>imgCtx.orig.indexOf(p)<0);
    if(added.length){
      const K0=IMG_KIND[imgCtx.kind];
      try{sb.storage.from(K0.bucket).remove(added).then(null,e=>console.warn("[사진] 고아 정리 실패",e));}catch(e){}
      added.forEach(imgCacheDrop);
    }
  }
  imgCtx={kind:kind, draftId:id||uid(), cur:Array.isArray(existing)?existing.slice():[],
          orig:Array.isArray(existing)?existing.slice():[]};
}
function imgClear(){imgCtx={kind:null,draftId:null,cur:[],orig:[]};}
/* 편집 화면에 넣을 '사진 첨부' 블록 HTML */
function imgPickHtml(){
  return `<div class="dimg-pick">
      <button class="ghostb" type="button" onclick="document.getElementById('imgfile').click()">＋ 사진 첨부</button>
      <input type="file" id="imgfile" accept="image/*" multiple style="display:none" onchange="imgPick(this)">
      <span class="meta">올리기 전에 자동으로 줄여서 저장해요 (가로 최대 1280px)</span>
      <span class="dimg-stat" id="imgstat"></span></div>
    <div id="imgedit" class="dimg-grid"></div>`;
}
/* 보기 화면에 넣을 사진 영역 HTML — 1장이면 꽉 차게, 2장 이상이면 한 줄에 2장 */
function imgViewHtml(imgs){
  return (imgs&&imgs.length)?`<div id="imgview" class="dimg-view${imgs.length>1?" multi":""}"></div>`:"";
}

function compressImage(file,maxW,quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h){reject(new Error("이미지 크기를 읽지 못했어요"));return;}
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const cx=cv.getContext("2d");
      cx.fillStyle="#ffffff";cx.fillRect(0,0,w,h);   /* 투명 PNG 가 검게 나오는 것 방지 */
      cx.drawImage(img,0,0,w,h);
      cv.toBlob(b=>{b?resolve(b):reject(new Error("압축에 실패했어요"));},"image/jpeg",quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("이미지를 열지 못했어요"));};
    img.src=url;
  });
}
/* 목표 용량에 닿을 때까지 품질(그래도 크면 가로폭)을 단계적으로 낮춘다 */
async function compressToTarget(file){
  let q=DIARY_Q, w=DIARY_MAXW;
  let blob=await compressImage(file,w,q);
  for(let i=0;i<3&&blob.size>DIARY_TARGET*1.2;i++){
    q=Math.max(0.4,q-0.12);
    if(blob.size>DIARY_TARGET*2.2)w=Math.max(900,Math.round(w*0.85));
    blob=await compressImage(file,w,q);
  }
  return blob;
}
async function signDiaryImg(path,bucket){
  const hit=imgCacheGet(path);
  if(hit)return hit;
  imgCacheDrop(path);          /* 만료된 항목이면 치우고 새로 받는다 */
  const bk=bucket||(path.indexOf("/note/")>=0||path.indexOf("/qt/")>=0||path.indexOf("/fb/")>=0||
                    path.indexOf("/sermon/")>=0||path.indexOf("/book/")>=0?NOTE_BUCKET:DIARY_BUCKET);
  try{
    const r=await sb.storage.from(bk).createSignedUrl(path,IMG_TTL_SEC);
    if(r&&!r.error&&r.data&&r.data.signedUrl){
      imgCacheSet(path,r.data.signedUrl,IMG_REFRESH_MS,false);
      return r.data.signedUrl;
    }
    console.warn("[사진] signed URL 실패",path,r&&r.error);
  }catch(e){console.warn("[사진] signed URL 예외",e);}
  return null;
}
window.imgPick=async(input)=>{
  const files=Array.prototype.slice.call(input.files||[]);
  input.value="";
  if(!files.length)return;
  if(!(typeof sb!=="undefined"&&sb&&currentUser)){alert("로그인 후에 사진을 올릴 수 있어요.");return;}
  if(!imgCtx.kind){console.warn("[사진] 편집 맥락이 없음");return;}
  const K=IMG_KIND[imgCtx.kind];
  if(!imgCtx.draftId)imgCtx.draftId=uid();
  const st=document.getElementById("imgstat");
  let ok=0;
  for(let n=0;n<files.length;n++){
    const f=files[n];
    if(!/^image\//.test(f.type||"")){console.warn("[사진] 이미지가 아님",f.name);continue;}
    if(st)st.textContent=`올리는 중... ${n+1}/${files.length}`;
    try{
      const blob=await compressToTarget(f);
      const name=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+".jpg";
      const path=currentUser.id+"/"+K.dir+imgCtx.draftId+"/"+name;
      const up=await sb.storage.from(K.bucket).upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(up.error)throw up.error;
      imgCtx.cur.push(path);
      imgCacheSet(path,URL.createObjectURL(blob),IMG_BLOB_MS,true);   /* 미리보기는 round-trip 없이 바로 */
      ok++;
    }catch(e){
      console.warn("[사진] 업로드 실패",e);
      alert("사진 업로드에 실패했어요: "+((e&&e.message)||e));
    }
  }
  if(st)st.textContent=ok?`${ok}장 올렸어요`:"";
  drawImgEdit();
  if(ok&&st)setTimeout(()=>{if(st)st.textContent="";},2500);
};
window.imgDel=async(i)=>{
  const p=imgCtx.cur[i];if(!p)return;
  if(!confirm("이 사진을 삭제할까요?"))return;
  const K=IMG_KIND[imgCtx.kind]||IMG_KIND.diary;
  try{await sb.storage.from(K.bucket).remove([p]);}catch(e){console.warn("[사진] 삭제 실패",e);}
  imgCtx.cur.splice(i,1);
  const oi=imgCtx.orig.indexOf(p);if(oi>=0)imgCtx.orig.splice(oi,1);
  imgCacheDrop(p);
  /* 이미 저장된 글이면 지운 사실을 바로 반영해 끊어진 참조가 남지 않게 한다 */
  const arr=DB[K.arr]||[];
  const rec=arr.find(x=>x.id===imgCtx.draftId);
  if(rec){rec.images=imgCtx.cur.slice();save();}
  drawImgEdit();
};
/* 편집 중 올린 사진 중 저장되지 않은 것들을 Storage 에서 치운다 (취소 시) */
async function imgDiscardNew(){
  const added=imgCtx.cur.filter(p=>imgCtx.orig.indexOf(p)<0);
  if(added.length){
    const K=IMG_KIND[imgCtx.kind]||IMG_KIND.diary;
    try{await sb.storage.from(K.bucket).remove(added);}catch(e){console.warn("[사진] 취소 정리 실패",e);}
    added.forEach(imgCacheDrop);
  }
  imgClear();
}
/* 글을 지울 때 그 글의 사진도 함께 지운다 */
async function imgRemoveAll(kind,imgs){
  if(!imgs||!imgs.length)return;
  const K=IMG_KIND[kind]||IMG_KIND.diary;
  try{await sb.storage.from(K.bucket).remove(imgs);}catch(e){console.warn("[사진] 삭제 실패",e);}
  imgs.forEach(imgCacheDrop);
}
async function drawImgEdit(){
  const el=document.getElementById("imgedit");if(!el)return;
  if(!imgCtx.cur.length){el.innerHTML="";return;}
  const bk=imgBucketOf(imgCtx.kind);
  el.innerHTML=imgCtx.cur.map((p,i)=>
    `<div class="dimg"><img alt="첨부 사진 ${i+1}" data-p="${esc(p)}"><button class="dimg-x" type="button" onclick="imgDel(${i})" title="이 사진 삭제">×</button></div>`).join("");
  const imgs=el.querySelectorAll("img");
  for(let i=0;i<imgs.length;i++){
    const u=await signDiaryImg(imgs[i].getAttribute("data-p"),bk);
    if(u)imgs[i].src=u;
  }
}
async function drawImgView(kind,paths){
  const el=document.getElementById("imgview");if(!el||!paths||!paths.length)return;
  const bk=imgBucketOf(kind);
  el.innerHTML=paths.map((p,i)=>
    `<a class="dimg-v" data-p="${esc(p)}" target="_blank" rel="noopener" title="원본 크기로 열기"><img alt="사진 ${i+1}" loading="lazy"></a>`).join("");
  const as=el.querySelectorAll("a");
  for(let i=0;i<as.length;i++){
    const u=await signDiaryImg(as[i].getAttribute("data-p"),bk);
    if(u){as[i].href=u;as[i].querySelector("img").src=u;}
  }
}

/* ===== 4) 목표 (카테고리 없음 · 진행바 1줄 · 설명) ===== */
let goalOpen={};
let editGoalId=null;
let goalYear=null;
function rGoals(){
  if(goalYear===null)goalYear=String(new Date().getFullYear());
  const cy=String(new Date().getFullYear());
  const years=[...new Set(DB.goals.map(g=>String(g.year||cy)).concat(cy,String(goalYear)))].sort().reverse();
  main.innerHTML=`<h1 class="page-h">목표</h1><p class="page-sub">연도별로 목표와 진행률을 관리해요.</p>
  <div class="sub-tabs" style="flex-wrap:wrap">${years.map(y=>`<button class="${y===String(goalYear)?"on":""}" onclick="setGoalYear('${y}')">${y}년</button>`).join("")}<button onclick="addGoalYear()" style="border-style:dashed;color:var(--muted)">＋ 연도</button></div>
  <details class="acard"><summary>목표 추가</summary><div class="acbody">

  <div class="card"><h2>${goalYear}년 목표</h2><div id="glist"></div></div>`;
  document.getElementById("gadd").onclick=()=>{const t=val("gt");if(!t)return alert("목표를 입력하세요.");
    DB.goals.push({id:uid(),year:String(goalYear),title:t,progress:0,desc:""});save();drawG();document.getElementById("gt").value="";};
  drawG();
}
window.setGoalYear=(y)=>{goalYear=y;rGoals();};
window.addGoalYear=()=>{const y=prompt("추가할 연도 (예: 2027)",String(Number(new Date().getFullYear())+1));if(y&&/^\d{4}$/.test(y.trim())){goalYear=y.trim();rGoals();}};
function drawG(){
  const cy=String(new Date().getFullYear());
  DB.goals.forEach(g=>{if(!g.id)g.id=uid();});
  const rows=DB.goals.filter(g=>String(g.year||cy)===String(goalYear));
  const e=document.getElementById("glist");
  const mob=isMobile();
  e.innerHTML=rows.length?rows.map((g,ri)=>`
    <div style="padding:12px 0;border-bottom:1px solid var(--line)" ${mob?"":`draggable="true" ondragstart="rowDragStart(event,'goals','${g.id}')" ondragover="rowDragOver(event)" ondrop="rowDrop(event,'goals','${g.id}')" ondragend="rowDragEnd()"`}>
      <div style="display:flex;align-items:center;gap:8px">
        ${mob?`<button class="linklike" onclick="goalMove('${g.id}',-1)" ${ri===0?"disabled":""}>▲</button><button class="linklike" onclick="goalMove('${g.id}',1)" ${ri===rows.length-1?"disabled":""}>▼</button>`:`<span style="color:var(--muted);cursor:grab" title="드래그해서 순서 변경">⠿</span>`}
        ${g.id===editGoalId
          ?`<input id="eg_${g.id}" value="${esc(g.title)}" style="flex:1" onkeydown="if(event.key==='Enter')goalNameSave('${g.id}')"><button class="linklike" onclick="goalNameSave('${g.id}')">저장</button><button class="linklike" onclick="goalNameCancel()">취소</button>`
          :`<span style="flex:1;font-weight:500;cursor:pointer" onclick="goalNameEdit('${g.id}')" title="클릭해서 이름 수정">${esc(g.title)}</span><button class="linklike" onclick="toggleGoalDesc('${g.id}')" title="설명 열기/닫기">${goalOpen[g.id]?"▴":"▾"}</button>`}
        <button class="del" onclick="delGoal('${g.id}')">×</button></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <input type="range" min="0" max="100" value="${g.progress}" oninput="this.nextElementSibling.textContent=this.value+'%'" onchange="setProg('${g.id}',this.value)" style="flex:1">
        <span class="meta" style="width:42px;text-align:right">${g.progress}%</span></div>
      ${goalOpen[g.id]?`<textarea class="mt ta-grow" rows="2" placeholder="목표에 대한 설명·계획을 적어보세요" onchange="setGoalDesc('${g.id}',this.value)">${esc(g.desc||"")}</textarea>`:""}
    </div>`).join(""):'<div class="empty">이 해에 등록된 목표가 없어요.</div>';
  if(editGoalId){const el=document.getElementById("eg_"+editGoalId);if(el)el.focus();}
  sizeGrow(e);
}
window.toggleGoalDesc=(id)=>{goalOpen[id]=!goalOpen[id];drawG();};
window.goalNameEdit=(id)=>{editGoalId=id;drawG();};
window.goalNameCancel=()=>{editGoalId=null;drawG();};
window.goalNameSave=(id)=>{const el=document.getElementById("eg_"+id);const g=DB.goals.find(x=>x.id===id);if(g&&el){const v=el.value.trim();if(v)g.title=v;}editGoalId=null;save();drawG();};
window.goalMove=(id,dir)=>{const cy=String(new Date().getFullYear());const rows=DB.goals.filter(g=>String(g.year||cy)===String(goalYear));const ri=rows.findIndex(g=>g.id===id);const rj=ri+dir;if(ri<0||rj<0||rj>=rows.length)return;const a=DB.goals;const i=a.findIndex(g=>g.id===rows[ri].id);const j=a.findIndex(g=>g.id===rows[rj].id);[a[i],a[j]]=[a[j],a[i]];save();drawG();};
window.setGoalDesc=(id,v)=>{const g=DB.goals.find(x=>x.id===id);if(g){g.desc=v;save();}};
window.setProg=(id,v)=>{const g=DB.goals.find(x=>x.id===id);if(g){g.progress=parseInt(v);save();drawG();}};
window.delGoal=(id)=>{DB.goals=DB.goals.filter(x=>x.id!==id);save();drawG();};

/* ===== 5) 신앙 (기도제목 + QT 게시판) ===== */
let faithTab="prayer";
let editPrayerId=null;
let qtMode="list", qtSel=null, qtYear=null, qtMonth="all";
function rFaith(){
  main.innerHTML=`<h1 class="page-h">교회 생활</h1><p class="page-sub">기도제목과 말씀을 기록해요.</p>
  <div class="sub-tabs" style="align-items:center;flex-wrap:wrap">
    <button data-f="prayer" class="${faithTab==="prayer"?"on":""}">기도제목</button>
    <button data-f="qt" class="${faithTab==="qt"?"on":""}">QT · 말씀</button>
    <button data-f="sermon" class="${faithTab==="sermon"?"on":""}">설교말씀</button>
    <a class="linkchip" href="https://docs.google.com/spreadsheets/d/1FVIHNJuDUAIhb8Ito_5BJGkOBK0R2T0tN4vat7QXYuo/edit?gid=1013255948#gid=1013255948" target="_blank" rel="noopener">전체 출석현황 ↗</a>
    <a class="linkchip" href="https://docs.google.com/spreadsheets/d/1ds7rZMMqnEPDJUhimsc_9QNtlQFTwN5YSX_QuqzO2ss/edit" target="_blank" rel="noopener">청년부 출석현황 ↗</a></div>
  <div id="fbody"></div>`;
  main.querySelectorAll(".sub-tabs button").forEach(b=>b.onclick=()=>{faithTab=b.dataset.f;qtMode="list";sermonMode="list";rFaith();});
  if(faithTab==="prayer")renderPrayer();else if(faithTab==="qt")renderQT();else renderSermon();
}
function renderPrayer(){
  document.getElementById("fbody").innerHTML=`
    <div class="card"><h2>기도제목 추가</h2>
      <input id="pt" placeholder="기도제목">
      <textarea id="pc" class="mt" rows="2" placeholder="내용 (선택)"></textarea>
      <button class="addb mt" id="padd">+ 추가</button></div>
    <div class="card"><h2>기도제목 목록</h2><div id="plist"></div></div>`;
  document.getElementById("padd").onclick=()=>{const t=val("pt");if(!t)return alert("기도제목을 입력하세요.");
    DB.prayers.push({id:uid(),title:t,content:val("pc"),answered:false});save();drawP();
    document.getElementById("pt").value="";document.getElementById("pc").value="";};
  drawP();
}
function drawP(){
  const e=document.getElementById("plist");const mob=isMobile();
  DB.prayers.forEach(p=>{if(!p.id)p.id=uid();});
  const n=DB.prayers.length;
  e.innerHTML=n?DB.prayers.map((p,ri)=>{
    if(p.id===editPrayerId){
      return `<div class="item" style="display:block">
        <input id="ep_t_${p.id}" value="${esc(p.title)}" placeholder="기도제목">
        <textarea id="ep_c_${p.id}" class="mt" rows="2" placeholder="내용 (선택)">${esc(p.content||"")}</textarea>
        <div class="row mt"><button class="addb" onclick="prayerSave('${p.id}')">저장</button><button class="ghostb" style="flex:0 0 80px" onclick="prayerEditCancel()">취소</button></div></div>`;
    }
    return `<div class="item ${p.answered?"done":""}" ${mob?"":`draggable="true" ondragstart="rowDragStart(event,'prayers','${p.id}')" ondragover="rowDragOver(event)" ondrop="rowDrop(event,'prayers','${p.id}')" ondragend="rowDragEnd()"`}>
    <button class="chk ${p.answered?"on":""}" onclick="togglePrayer('${p.id}')">${p.answered?"✓":""}</button>
    <div class="bd" style="cursor:pointer" onclick="prayerEdit('${p.id}')" title="클릭해서 수정"><div class="t">${mob?"":`<span style="color:var(--muted);cursor:grab" title="드래그해서 순서 변경">⠿</span> `}${esc(p.title)}</div>${p.content?`<div class="meta" style="white-space:pre-wrap;margin-top:2px">${esc(p.content)}</div>`:""}${p.answered?'<div class="meta">응답됨 🙏</div>':""}</div>
    ${mob?`<button class="linklike" onclick="prayerMove('${p.id}',-1)" ${ri===0?"disabled":""}>▲</button><button class="linklike" onclick="prayerMove('${p.id}',1)" ${ri===n-1?"disabled":""}>▼</button>`:""}
    <button class="del" onclick="delPrayer('${p.id}')">×</button></div>`;
  }).join(""):'<div class="empty">기도제목이 없어요.</div>';
}
window.togglePrayer=(id)=>{const p=DB.prayers.find(x=>x.id===id);if(p){p.answered=!p.answered;save();drawP();}};
window.prayerEdit=(id)=>{editPrayerId=id;drawP();};
window.prayerEditCancel=()=>{editPrayerId=null;drawP();};
window.prayerSave=(id)=>{const p=DB.prayers.find(x=>x.id===id);if(p){const t=document.getElementById("ep_t_"+id).value.trim();if(t)p.title=t;p.content=document.getElementById("ep_c_"+id).value.trim();}editPrayerId=null;save();drawP();};
window.prayerMove=(id,dir)=>rowMove("prayers",id,dir);
window.delPrayer=(id)=>{DB.prayers=DB.prayers.filter(x=>x.id!==id);save();drawP();};
function renderQT(){
  const fb=document.getElementById("fbody");
  if(qtMode==="write"){
    const ed=qtSel?DB.qt.find(x=>x.id===qtSel):null;
    if(imgCtx.kind!=="qt")imgStart("qt",ed?ed.id:uid(),ed&&ed.images);
    fb.innerHTML=`<div class="card"><h2>말씀 기록 ${ed?"수정":"쓰기"}</h2>
      <div class="row"><input type="date" id="qd" class="n1" value="${ed?ed.date:T()}"><input id="qv" placeholder="말씀 (예: 시편 23편)" value="${ed?esc(ed.title):""}"></div>
      <textarea id="qn" class="mt ta-fill" rows="7" placeholder="묵상 내용  (줄 맨 앞에 # 또는 ## 를 쓰면 제목이 돼요)">${ed?esc(ed.content):""}</textarea>
      ${imgPickHtml()}
      <div class="row mt"><button class="addb" id="qsave">저장</button><button class="ghostb" style="flex:0 0 90px" onclick="qtCancel()">취소</button></div></div>`;
    drawImgEdit();
    document.getElementById("qsave").onclick=()=>{const v=val("qv"),n=val("qn");
      if(!v&&!n&&!imgCtx.cur.length)return alert("내용을 입력하거나 사진을 첨부하세요.");
      const imgs=imgCtx.cur.slice();
      let id;
      if(ed){ed.date=val("qd")||ed.date;ed.title=v||"말씀";ed.content=n;ed.images=imgs;id=ed.id;}
      else{id=imgCtx.draftId||uid();DB.qt.push({id:id,date:val("qd")||T(),title:v||"말씀",content:n,images:imgs});}
      save();imgClear();qtOpen(id);};
    return;
  }
  if(qtMode==="detail"){
    const q=DB.qt.find(x=>x.id===qtSel);if(!q){qtMode="list";return renderQT();}
    const imgs=Array.isArray(q.images)?q.images:[];
    fb.innerHTML=`<div class="card">
      <div class="detail-head">
        <button class="ghostb" onclick="qtBack()">‹ 목록</button>
        <button class="ghostb" onclick="qtEdit('${q.id}')">수정</button>
        <button class="ghostb danger" onclick="qtDel('${q.id}')">삭제</button></div>
      <div class="meta">${fmt(q.date)}${imgs.length?` · 사진 ${imgs.length}장`:""}</div>
      <h2 style="font-size:20px;margin:4px 0 12px">${esc(q.title)}</h2>
      <div class="detail-body">${mdBody(q.content)}</div>
      ${imgViewHtml(imgs)}</div>`;
    drawImgView("qt",imgs);
    return;
  }
  if(qtYear===null)qtYear=String(new Date().getFullYear());
  const years=[...new Set(DB.qt.map(q=>q.date.slice(0,4)).concat(String(new Date().getFullYear())))].sort().reverse();
  const list=DB.qt.filter(q=>q.date.slice(0,4)===String(qtYear)&&(qtMonth==="all"||q.date.slice(5,7)===qtMonth)).sort((a,b)=>b.date.localeCompare(a.date));
  fb.innerHTML=`<div class="card"><div class="row" style="align-items:center">
      <select class="n2" onchange="setQtYear(this.value)" style="flex:0 0 110px">${years.map(y=>`<option value="${y}" ${y===String(qtYear)?"selected":""}>${y}년</option>`).join("")}</select>
      <select class="n2" onchange="setQtMonth(this.value)" style="flex:0 0 110px"><option value="all" ${qtMonth==="all"?"selected":""}>전체 월</option>${[...Array(12)].map((_,i)=>{const m=String(i+1).padStart(2,"0");return `<option value="${m}" ${qtMonth===m?"selected":""}>${i+1}월</option>`;}).join("")}</select>
      <span style="flex:1"></span>
      <button class="addb" style="flex:0 0 130px" onclick="qtNew()">✏️ 기록 쓰기</button></div></div>
    <div class="card"><h2>지난 기록</h2>${list.length?list.map(q=>`
      <div class="item link" style="cursor:pointer" onclick="qtOpen('${q.id}')">
        <div class="bd"><div class="meta">${fmt(q.date)}</div><div class="t">${esc(q.title)}</div></div>
        <span class="meta" style="align-self:center">›</span></div>`).join(""):'<div class="empty">이 기간에 기록이 없어요.</div>'}</div>`;
}
window.setQtYear=(v)=>{qtYear=v;rFaith();};
window.setQtMonth=(v)=>{qtMonth=v;rFaith();};
window.qtNew=()=>{qtMode="write";qtSel=null;imgStart("qt",uid(),[]);rFaith();};
window.qtEdit=(id)=>{const q=DB.qt.find(x=>x.id===id);qtMode="write";qtSel=id;imgStart("qt",id,q&&q.images);rFaith();};
window.qtOpen=(id)=>{qtMode="detail";qtSel=id;rFaith();};
window.qtBack=()=>{qtMode="list";qtSel=null;rFaith();};
window.qtCancel=async()=>{const back=qtSel;await imgDiscardNew();if(back)qtOpen(back);else qtBack();};
window.qtDel=async(id)=>{
  if(!confirm("이 기록을 삭제할까요? (첨부한 사진도 같이 삭제됩니다)"))return;
  const q=DB.qt.find(x=>x.id===id);
  await imgRemoveAll("qt",(q&&Array.isArray(q.images))?q.images:[]);
  DB.qt=DB.qt.filter(x=>x.id!==id);save();qtBack();};

let sermonMode="list", sermonSel=null, sermonYear=null;
function renderSermon(){
  const fb=document.getElementById("fbody");
  if(sermonYear===null)sermonYear=String(new Date().getFullYear());
  if(sermonMode==="write"){
    const ed=sermonSel?DB.sermons.find(x=>x.id===sermonSel):null;

      <div class="row"><input type="date" id="sd" class="n1" value="${ed?ed.date:T()}"><input id="stt" placeholder="설교 제목" value="${ed?esc(ed.title):""}"></div>
      <div class="row mt"><input id="sref" placeholder="본문 (예: 출 25:31-40)" value="${ed?esc(ed.ref||""):""}"><input id="ssp" placeholder="인도자 (예: 이원규 목사님)" value="${ed?esc(ed.speaker||""):""}"></div>

    drawImgEdit();
    document.getElementById("ssave").onclick=()=>{const t=val("stt");if(!t)return alert("설교 제목을 입력하세요.");
      const imgs=imgCtx.cur.slice();
      let id;
      if(ed){ed.date=val("sd")||ed.date;ed.title=t;ed.ref=val("sref");ed.speaker=val("ssp");ed.content=val("scont");ed.images=imgs;id=ed.id;}
      else{id=imgCtx.draftId||uid();DB.sermons.push({id:id,date:val("sd")||T(),title:t,ref:val("sref"),speaker:val("ssp"),content:val("scont"),images:imgs});}
      sermonYear=(val("sd")||T()).slice(0,4);save();imgClear();sermonOpen(id);};
    return;
  }
  if(sermonMode==="detail"){
    const s=DB.sermons.find(x=>x.id===sermonSel);if(!s){sermonMode="list";return renderSermon();}
    const imgs=Array.isArray(s.images)?s.images:[];
    fb.innerHTML=`<div class="card">

        <button class="ghostb" onclick="sermonBack()">‹ 목록</button>
        <button class="ghostb" onclick="sermonEdit('${s.id}')">수정</button>

      <div class="detail-body">${mdBody(s.content||"")}</div>
      ${imgViewHtml(imgs)}</div>`;
    drawImgView("sermon",imgs);
    return;
  }
  const years=[...new Set(DB.sermons.map(s=>s.date.slice(0,4)).concat(String(new Date().getFullYear())))].sort().reverse();
  if(!years.includes(String(sermonYear)))sermonYear=years[0];
  const list=DB.sermons.filter(s=>s.date.slice(0,4)===String(sermonYear)).sort((a,b)=>b.date.localeCompare(a.date));
  fb.innerHTML=`<div class="card"><div class="row" style="align-items:center">
      <select class="n2" onchange="setSermonYear(this.value)" style="flex:0 0 120px">${years.map(y=>`<option value="${y}" ${y===String(sermonYear)?"selected":""}>${y}년</option>`).join("")}</select>

      <button class="addb" style="flex:0 0 120px" onclick="sermonNew()">✏️ 설교 쓰기</button></div></div>
    <div class="card"><h2>설교 목록</h2>${list.length?list.map(s=>`
      <div class="item link" style="cursor:pointer" onclick="sermonOpen('${s.id}')">
        <div class="bd"><div class="meta">${fmt(s.date)}</div><div class="t">${esc(s.title)}</div>
        ${(s.ref||s.speaker)?`<div class="meta" style="margin-top:2px">${s.ref?esc(s.ref):""}${s.ref&&s.speaker?" · ":""}${s.speaker?esc(s.speaker):""}</div>`:""}</div>
        <span class="meta" style="align-self:center">›</span></div>`).join(""):'<div class="empty">이 해에 설교 기록이 없어요.</div>'}</div>`;

      <td class="meta" style="cursor:pointer" onclick="cliEdit(${i})" title="클릭해서 수정">${esc(c.note||"")}</td>
      <td style="text-align:right"><button class="del" onclick="delClient(${i})">×</button></td></tr>`;}).join("")}</table>`;

function weeklyPosts(cycle){
  if(!cycle)return 0;
  const days=(cycle.match(/[월화수목금토일]/g)||[]).length;
  if(days)return days;
  const m=cycle.match(/(\d+)\s*회/)||cycle.match(/(\d+)/);
  return m?parseInt(m[1]):0;
}
function recontractMonth(s){
  if(!s)return null;
  const iso=s.match(/^\d{4}-(\d{2})-\d{2}/);
  if(iso)return parseInt(iso[1]);
  const m=s.match(/(\d{1,2})[.\-\/]/);
  return m?parseInt(m[1]):null;
}
function recDisp(s){if(!s)return"-";const m=s.match(/^\d{4}-(\d{2})-(\d{2})/);return m?`${+m[1]}.${+m[2]}`:s;}
function drawSummary(){
  const el=document.getElementById("csummary");if(!el)return;
  const n=DB.clients.length;
  const weekly=DB.clients.reduce((a,c)=>a+weeklyPosts(c.cycle),0);
  const monthly=weekly*4;
  const curM=new Date().getMonth()+1;
  const nextM=curM===12?1:curM+1;
  const due=DB.clients.filter(c=>recontractMonth(c.recontract)===curM);
  const dueNext=DB.clients.filter(c=>recontractMonth(c.recontract)===nextM);
  el.innerHTML=`
    <div class="stat">
      <div class="s"><div class="lab">현재 클라이언트</div><div class="val">${n}명</div></div>
      <div class="s"><div class="lab">주간 포스트</div><div class="val">${weekly}개</div></div>
      <div class="s"><div class="lab">월간 포스트</div><div class="val">${monthly}개</div></div>
      <div class="s"><div class="lab">${curM}월 재계약</div><div class="val">${due.length}명</div></div>
      <div class="s"><div class="lab">${nextM}월 재계약</div><div class="val">${dueNext.length}명</div></div>
    </div>
    <div class="meta">📌 ${curM}월 재계약 대상: ${due.length?due.map(c=>esc(c.name)).join(", "):"없음"}</div>
    <div class="meta" style="margin-top:4px">📌 ${nextM}월 재계약 대상: ${dueNext.length?dueNext.map(c=>esc(c.name)).join(", "):"없음"}</div>`;
}
/* ===== 통계보고 월별 제공 체크 =====
   데이터: 각 고객 레코드에 report = {"2026-11":1, ...} (제공한 달만 1로 보관)
   2026-11 이전 달은 열지 않는다. */
const RPT_START="2026-11";
let rptYM=null;
function ymOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function rptYMDefault(){const n=ymOf(new Date());return n<RPT_START?RPT_START:n;}
function ymShift(ym,delta){
  const p=ym.split("-");let y=+p[0],m=+p[1]+delta;
  while(m<1){m+=12;y--;}
  while(m>12){m-=12;y++;}
  return y+"-"+String(m).padStart(2,"0");
}
function ymLabel(ym){const p=ym.split("-");return p[0]+"년 "+(+p[1])+"월";}
function rptDone(c,ym){return !!(c&&c.report&&c.report[ym]);}
function drawRpt(){
  const el=document.getElementById("crpt");if(!el)return;
  if(!rptYM)rptYM=rptYMDefault();
  const ym=rptYM,cs=DB.clients||[];
  const done=cs.filter(c=>rptDone(c,ym)),undone=cs.filter(c=>!rptDone(c,ym));
  const pct=cs.length?Math.round(done.length/cs.length*100):0;
  el.innerHTML=`
    <div class="rpt-head">
      <button class="rpt-nav" onclick="rptNav(-1)" ${ym<=RPT_START?"disabled":""} title="이전 달">◀</button>
      <span class="ym">${ymLabel(ym)}</span>
      <button class="rpt-nav" onclick="rptNav(1)" title="다음 달">▶</button>
      <button class="rpt-nav" onclick="rptThis()" ${ym===rptYMDefault()?"disabled":""}>이번 달</button>
      <span class="rpt-spacer"></span>
      <button class="rpt-nav" onclick="rptAll(1)">전체 O</button>
      <button class="rpt-nav" onclick="rptAll(0)">전체 X</button>
    </div>
    <div class="stat">
      <div class="s"><div class="lab">제공 완료</div><div class="val">${done.length}명</div></div>
      <div class="s"><div class="lab">미제공</div><div class="val">${undone.length}명</div></div>
      <div class="s"><div class="lab">전체</div><div class="val">${cs.length}명</div></div>
      <div class="s"><div class="lab">진행률</div><div class="val">${pct}%</div></div>
    </div>
    <div class="rpt-bar"><i style="width:${pct}%"></i></div>
    ${cs.length?`<div class="rpt-grid">${cs.map((c,i)=>{
      const on=rptDone(c,ym);
      return `<div class="rpt-row">
        <button class="oxb ${on?"on":"off"}" onclick="rptToggle(${i})" title="클릭해서 ${on?"미제공":"제공"}으로 변경">${on?"O":"X"}</button>
        <span class="nm">${esc(c.name||"")}</span>
        <span class="fd">${esc(c.field||"")}</span>
      </div>`;}).join("")}</div>
    <div class="meta" style="margin-top:12px">📌 ${ymLabel(ym)} 미제공: ${undone.length?undone.map(c=>esc(c.name)).join(", "):"없음 ✅"}</div>`
    :`<div class="empty">등록된 고객이 없어요.</div>`}`;
}
window.rptNav=(d)=>{const n=ymShift(rptYM,d);if(n<RPT_START)return;rptYM=n;drawRpt();};
window.rptThis=()=>{rptYM=rptYMDefault();drawRpt();};
window.rptToggle=(i)=>{
  const c=DB.clients[i];if(!c)return;
  if(!c.report||typeof c.report!=="object")c.report={};
  if(c.report[rptYM])delete c.report[rptYM];else c.report[rptYM]=1;
  c.updatedAt=new Date().toISOString();
  save();drawRpt();
};
window.rptAll=(v)=>{
  const cs=DB.clients||[];if(!cs.length)return;
  if(!confirm(ymLabel(rptYM)+" 전체를 "+(v?"제공(O)":"미제공(X)")+"으로 바꿀까요?"))return;
  const t=new Date().toISOString();
  cs.forEach(c=>{
    if(!c.report||typeof c.report!=="object")c.report={};
    if(v)c.report[rptYM]=1;else delete c.report[rptYM];
    c.updatedAt=t;
  });
  save();drawRpt();
};

window.setSheet=(i)=>{const u=prompt("문의시트 링크를 붙여넣으세요 (https://...)",DB.clients[i].sheet||"");if(u!==null){DB.clients[i].sheet=u.trim();save();drawC();}};
window.setClink=(i)=>{const u=prompt("클라이언트 링크를 붙여넣으세요 (https://...)",DB.clients[i].clink||"");if(u!==null){DB.clients[i].clink=u.trim();save();drawC();}};

};

window.rowDragOver=(e)=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";};
window.rowDrop=(e,a,id)=>{e.preventDefault();if(dragRow.arr!==a||dragRow.id==null||dragRow.id===id){dragRow={arr:null,id:null};return;}
  const arr=DB[a];const fi=arr.findIndex(x=>x.id===dragRow.id);if(fi<0){dragRow={arr:null,id:null};return;}
  const m=arr.splice(fi,1)[0];const ti=arr.findIndex(x=>x.id===id);arr.splice(ti<0?arr.length:ti,0,m);
  dragRow={arr:null,id:null};save();reRenderArr(a);};
window.rowDragEnd=()=>{dragRow={arr:null,id:null};};
window.rowMove=(a,id,dir)=>{const arr=DB[a];const i=arr.findIndex(x=>x.id===id);const j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();reRenderArr(a);};

  const years=[...new Set(DB.books.map(b=>String(b.year)).concat(String(new Date().getFullYear())))].sort().reverse();
  const list=DB.books.filter(b=>String(b.year)===String(bookYear)&&(bookStatus==="all"||b.status===bookStatus));
  main.innerHTML=`<h1 class="page-h">독서노트</h1><p class="page-sub">읽은 책과 노트를 기록해요.</p>
  <div class="card"><div class="row" style="align-items:center">
      <select class="n2" onchange="setBookYear(this.value)" style="flex:0 0 110px">${years.map(y=>`<option value="${y}" ${y===String(bookYear)?"selected":""}>${y}년</option>`).join("")}</select>
      <select class="n2" onchange="setBookStatus(this.value)" style="flex:0 0 120px">
        <option value="all" ${bookStatus==="all"?"selected":""}>전체</option>
        <option value="읽는중" ${bookStatus==="읽는중"?"selected":""}>읽는중</option>
        <option value="완료" ${bookStatus==="완료"?"selected":""}>완료</option></select>
      <span style="flex:1"></span>
      <button class="addb" style="flex:0 0 120px" onclick="bookNew()">✏️ 책 추가</button></div></div>
  <div class="card"><h2>${bookYear}년 독서 목록</h2>${list.length?list.map(b=>`
    <div class="item link" style="cursor:pointer" onclick="bookOpen('${b.id}')">
      <div class="bd"><div class="t">${esc(b.title)}</div>
        <div class="meta"><span class="pill" style="background:${b.status==="완료"?"#2e2e2e":"var(--accent-soft)"};color:${b.status==="완료"?"var(--good)":"var(--accent)"}">${esc(b.status)}</span> ${b.genre?esc(b.genre):""}</div></div>

/* ═══════════════════════════════════════════════════════════════
   백업 — 별도 테이블(app_backups)에 저장
   예전에는 스냅샷이 app_data 블롭 안에 함께 들어 있어서,
   체크박스 하나 누를 때마다 수 MB를 통째로 업로드해야 했다.
   (실측: 전체 5.5MB 중 97%가 백업이었다)
   이제 백업은 별도 테이블로 빠지고, 일상 저장 페이로드에서 제외된다.
   ═══════════════════════════════════════════════════════════════ */
const BACKUP_KEEP=60;      /* 보관 개수 */
const BACKUP_EVERY_H=6;    /* 자동 스냅샷 최소 간격(시간) */
function snapshotData(){const c={...DB};delete c.backups;delete c.trash;return JSON.stringify(c);}
function fmtDT(iso){const x=new Date(String(iso).replace(" ","T"));return `${x.getMonth()+1}월 ${x.getDate()}일 (${DOW[x.getDay()]}) ${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`;}

async function bkList(){
  if(!sb||!currentUser)return [];
  const r=await sb.from("app_backups").select("id,ts,guard").eq("user_id",currentUser.id).order("ts",{ascending:false});
  if(r.error){console.warn("[backup] 목록 조회 실패",r.error);return null;}
  return r.data||[];
}
async function bkInsert(guard){
  if(!sb||!currentUser)return false;
  const r=await sb.from("app_backups").insert({id:uid(),user_id:currentUser.id,ts:new Date().toISOString(),data:snapshotData(),guard:!!guard});
  if(r.error){console.warn("[backup] 저장 실패",r.error);return false;}
  await bkPrune();
  return true;
}
async function bkPrune(){
  const list=await bkList();
  if(!list||list.length<=BACKUP_KEEP)return;
  const old=list.slice(BACKUP_KEEP).map(b=>b.id);
  if(old.length)await sb.from("app_backups").delete().in("id",old);
}
/* 앱을 열 때, 마지막 백업이 오래됐으면 새로 뜬다 */
async function autoBackup(){
  const list=await bkList();
  if(list===null)return;                 /* 조회 실패 시 아무 것도 하지 않는다 */
  const last=list.length?new Date(String(list[0].ts).replace(" ","T")).getTime():0;
  if(Date.now()-last >= BACKUP_EVERY_H*3600*1000)await bkInsert(false);
}
function pruneBackups(){/* 테이블 기반으로 이전됨 (bkPrune) */}

/* ================================================================
   [안전 패치] 데이터 손실 방지 — 병합 저장 · 백업 강화 · 휴지통
   기존 save()/autoBackup()/pruneBackups() 를 안전 버전으로 교체.
   (2026-07 heuk1218 업무관리 앱 / 통짜-blob 덮어쓰기 사고 대응)
   ================================================================ */
(function(){
  "use strict";
  /* ---- 3-way 병합 코어 ---- */
  function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(36); }
  function eqv(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
  function tstamp(r){ return (r && (r.updatedAt||r.mtime||r._u||r.ts)) || null; }
  function recId(rec, seen){
    if(rec && rec.id!=null) return String(rec.id);
    const c=Object.assign({},rec); delete c.id;
    let base='h'+hashStr(JSON.stringify(c));
    if(seen){ let n=(seen.get(base)||0)+1; seen.set(base,n); if(n>1) base+='#'+n; }
    return base;
  }
  function ensureIds(D, cols){
    for(const col of cols){ const arr=D[col]; if(!Array.isArray(arr)) continue;
      const seen=new Map();
      for(const rec of arr){ if(rec && typeof rec==='object' && rec.id==null){ rec.id=recId(rec,seen); } }
    }
  }
  function indexById(arr){ const m=new Map(); (arr||[]).forEach(rec=>{ const id=(rec&&rec.id!=null)?String(rec.id):recId(rec); m.set(id,rec); }); return m; }
  function pickNewer(m,s,b){
    const tm=tstamp(m), tsv=tstamp(s);
    if(tm&&tsv) return (tm>=tsv)?m:s;
    if(b!=null){ if(eqv(m,b)&&!eqv(s,b)) return s; if(eqv(s,b)&&!eqv(m,b)) return m; }
    return m;
  }
  function mergeArray(baseMap, mineArr, serverArr){
    const mine=indexById(mineArr), server=indexById(serverArr), ids=new Set();
    if(baseMap) for(const k of baseMap.keys()) ids.add(k);
    for(const k of mine.keys()) ids.add(k);
    for(const k of server.keys()) ids.add(k);
    const out=[], deleted=[];
    for(const id of ids){
      const inB=baseMap?baseMap.has(id):false, inM=mine.has(id), inS=server.has(id);
      if(inB&&!inM&&inS){ deleted.push(server.get(id)); continue; }
      if(inB&&inM&&!inS){ continue; }
      if(inB&&!inM&&!inS){ continue; }
      if(inM&&inS){ out.push(pickNewer(mine.get(id),server.get(id),baseMap?baseMap.get(id):null)); continue; }
      if(inM){ out.push(mine.get(id)); continue; }
      if(inS){ out.push(server.get(id)); continue; }
    }
    return {arr:out, deleted};
  }
  function pickNewerVal(m,s,b){ if(b!==null&&b!==undefined){ if(eqv(m,b)&&!eqv(s,b)) return s; if(eqv(s,b)&&!eqv(m,b)) return m; } return m; }
  function mergeMap(baseObj, mineObj, serverObj){
    const base=baseObj||{}, mine=mineObj||{}, server=serverObj||{};
    const keys=new Set([...Object.keys(base),...Object.keys(mine),...Object.keys(server)]), out={};
    for(const k of keys){
      const inB=k in base, inM=k in mine, inS=k in server;
      if(inB&&!inM&&inS) continue;
      if(inB&&inM&&!inS) continue;
      if(inB&&!inM&&!inS) continue;
      if(inM&&inS){ out[k]=pickNewerVal(mine[k],server[k],inB?base[k]:null); continue; }
      if(inM){ out[k]=mine[k]; } else if(inS){ out[k]=server[k]; }
    }
    return out;
  }
  function snapForBase(D, aCols, mCols){
    const arrays={}, maps={};
    for(const col of aCols){ arrays[col]=indexById((D[col]||[]).map(r=>JSON.parse(JSON.stringify(r)))); }
    for(const col of mCols){ maps[col]=JSON.parse(JSON.stringify(D[col]||{})); }
    return {arrays, maps};
  }

  /* ---- 컬럼 구성 ---- */
  /* backups 는 별도 테이블로 빠졌으므로 병합 대상에서 제외한다
     (남겨두면 백업 파일 가져오기 때 블롭 안으로 다시 들어온다) */
  const ARRAY_COLS=["schedules","routines","diary","goals","prayers","qt","sermons","clients","costs","notes","feedback","books","accounts","places","banks","trash"];
  const MAP_COLS=["dayinfo","monthmemo"];

  let baseState=null, baseVersion=null, _mt=null, _busy=false, _pending=false;
  function nowISO(){ return new Date().toISOString(); }

  /* ---- 로드 직후 base 확정(삭제 오인 방지) ---- */
  function tryInitBase(){
    if(baseState) return;
    if(!(typeof sb!=='undefined' && sb && currentUser && dataReady && DB)) return;
    ensureIds(DB, ARRAY_COLS);
    if(!Array.isArray(DB.trash)) DB.trash=[];
    sb.from("app_data").select("updated_at").eq("user_id",currentUser.id).maybeSingle()
      .then(r=>{ baseVersion=(r&&r.data&&r.data.updated_at)||null; baseState=snapForBase(DB,ARRAY_COLS,MAP_COLS); })
      .catch(()=>{ baseState=snapForBase(DB,ARRAY_COLS,MAP_COLS); });
  }
  const _bt=setInterval(()=>{ tryInitBase(); if(baseState) clearInterval(_bt); }, 300);

  function toTrash(recs){
    if(!recs||!recs.length) return;
    if(!Array.isArray(DB.trash)) DB.trash=[];
    const t=nowISO();
    for(const r of recs){ if(r&&typeof r==='object'){ DB.trash.push(Object.assign({},r,{_deletedAt:t})); } }
    const cutoff=Date.now()-30*864e5;
    DB.trash=DB.trash.filter(x=> !x._deletedAt || new Date(x._deletedAt).getTime()>=cutoff);
  }

  function keyOf(r){ return (r&&r.id!=null)?String(r.id):recId(r); }
  /* 전체 컬렉션 3-way 병합 + 대량삭제 차단기 */
  function mergeAll(bState, D, sData, aCols, mCols){
    const MAXDEL=8, FRAC=0.4; const per={}; let totalDel=0;
    for(const col of aCols){
      if(col==="trash"){ per[col]={arr:mergeArray(null, D[col]||[], sData[col]||[]).arr, deleted:[]}; continue; }
      const m=mergeArray(bState?bState.arrays[col]:null, D[col]||[], sData[col]||[]);
      per[col]=m; totalDel+=m.deleted.length;
    }
    let suspicious=totalDel>MAXDEL;
    for(const col of aCols){ if(col==="trash") continue; const m=per[col]; const sl=Array.isArray(sData[col])?sData[col].length:0; if(sl>=5 && m.deleted.length>sl*FRAC) suspicious=true; }
    const deletedOut=[];
    for(const col of aCols){ const m=per[col];
      if(col!=="trash" && suspicious && m.deleted.length){ const ids=new Set(m.arr.map(keyOf)); for(const d of m.deleted){ const k=keyOf(d); if(!ids.has(k)){ m.arr.push(d); ids.add(k);} } m.deleted=[]; }
      D[col]=m.arr; if(col!=="trash") for(const d of m.deleted) deletedOut.push(d);
    }
    for(const col of mCols){ D[col]=mergeMap(bState?bState.maps[col]:null, D[col]||{}, sData[col]||{}); }
    return {suspicious, deleted:deletedOut};
  }
  function mergeServerIntoDB(sData){
    const res=mergeAll(baseState, DB, sData, ARRAY_COLS, MAP_COLS);
    toTrash(res.deleted);
    if(res.suspicious){
      console.warn("[safe] 대량삭제 차단기 작동 → 서버 데이터 보존");
      try{ const sd=Object.assign({},sData); delete sd.backups; delete sd.trash;
           if(sb&&currentUser)sb.from("app_backups").insert({id:uid(),user_id:currentUser.id,ts:nowISO(),data:JSON.stringify(sd),guard:true}).then(null,e=>console.warn("[safe] guard backup",e));
      }catch(e){}
    }
  }

  async function doSave(){
    if(!(typeof sb!=='undefined' && sb && currentUser && dataReady)) return;
    if(_busy){ _pending=true; return; }
    _busy=true;
    try{
      ensureIds(DB, ARRAY_COLS);
      if(!Array.isArray(DB.trash)) DB.trash=[];
      const r=await sb.from("app_data").select("data,updated_at").eq("user_id",currentUser.id).maybeSingle();
      if(r.error){ console.warn("[safe] read fail; skip write", r.error); return; }
      const sData=r.data&&r.data.data;
      if(sData){ mergeServerIntoDB(sData); }
      const t=nowISO();
      const up=await sb.from("app_data").upsert({user_id:currentUser.id, data:DB, updated_at:t});
      if(up.error){ console.warn("[safe] write fail", up.error); return; }
      baseVersion=t; baseState=snapForBase(DB,ARRAY_COLS,MAP_COLS);
    } finally {
      _busy=false;
      if(_pending){ _pending=false; setTimeout(doSave,50); }
    }
  }

  /* ---- 기존 save()를 병합형으로 교체 (700ms 디바용스 유지) ---- */
  save = function(){ clearTimeout(_mt); _mt=setTimeout(function(){
    if(typeof sb!=='undefined' && sb && currentUser && dataReady){
      sb.from("app_data").upsert({user_id:currentUser.id, data:DB, updated_at:new Date().toISOString()}).then(null,function(e){ console.warn("save",e); });
    }
  },700); };

  /* ---- 백업: 별도 테이블(app_backups)로 이전됨 ----
     예전에는 여기서 pruneBackups/autoBackup 을 블롭 기반 버전으로 덮어썼다.
     이제 위쪽 테이블 기반 구현을 그대로 쓰므로 덮어쓰지 않는다.
     (덮어쓰면 백업이 다시 app_data 블롭 안으로 들어가 용량이 폭증한다) */

  /* ---- 백업 파일 내보내기 / 가져오기(병합) ---- */
  window.exportBackupFile=function(){
    try{
      const blob=new Blob([JSON.stringify(DB)],{type:"application/json"});
      const url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="업무관리_백업_"+T()+".json"; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    }catch(e){ alert("내보내기 실패: "+e.message); }
  };
  window.importBackupFile=function(file){
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const inc=JSON.parse(rd.result); ensureIds(inc,ARRAY_COLS);
      for(const col of ARRAY_COLS){ DB[col]=mergeArray(null, DB[col]||[], inc[col]||[]).arr; }
      for(const col of MAP_COLS){ DB[col]=mergeMap(null, DB[col]||{}, inc[col]||{}); }
      save(); if(typeof render==="function") render(); alert("백업 파일 병합 완료");
    }catch(e){ alert("가져오기 실패: "+e.message); } };
    rd.readAsText(file);
  };

  /* ---- 작은 백업 버튼(우하단, 눈에 거슬리지 않게) ---- */
  function addBackupBtn(){
    if(document.getElementById("safeBkBtn")) return;
    const wrap=document.createElement("div");
    wrap.id="safeBkBtn";
    wrap.style.cssText="position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99999;display:flex;gap:6px;opacity:.45";
    wrap.onmouseover=()=>wrap.style.opacity=".95"; wrap.onmouseout=()=>wrap.style.opacity=".45";
    const mk=(t)=>{ const b=document.createElement("button"); b.textContent=t;
      b.style.cssText="font-size:11px;padding:4px 7px;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#aaa"; return b; };
    const be=mk("⬇︎백업"), bi=mk("⬆︎복원");
    const fi=document.createElement("input"); fi.type="file"; fi.accept="application/json"; fi.style.display="none";
    be.onclick=()=>window.exportBackupFile();
    bi.onclick=()=>fi.click();
    fi.onchange=()=>{ if(fi.files&&fi.files[0]) window.importBackupFile(fi.files[0]); fi.value=""; };
    wrap.appendChild(be); wrap.appendChild(bi); wrap.appendChild(fi);
    document.body.appendChild(wrap);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",addBackupBtn); else addBackupBtn();

  console.log("[안전패치] 병합 저장·백업 강화·휴지텵 활성화됨");
})();

</script>
</body>
</html>
